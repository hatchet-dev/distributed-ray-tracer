[package]
name = "endpoint"
version = "0.1.0"
edition = "2021"
description = "Runtime-independent Hatchet serverless endpoint: verify, dispatch and render one tile"

[dependencies]
scene = { path = "../scene" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"

[features]
# Fidget's JIT (native builds only).
jit = ["scene/jit"]
