# The tile renderer (crates/server: render-tile, validate-shape) on Porter. The app (page,
# render API, orchestration workflows) stays on Cloudflare.
#
# Secrets go in a Porter environment group, created before the first deploy:
#   ray-tracer-secrets: HATCHET_SIGNING_SECRET, HATCHET_CLIENT_TOKEN
# Then register https://<this service's domain>/hatchet/healthcheck and /hatchet/trigger with
# Hatchet as a GENERIC_HTTP endpoint (requestTimeoutSeconds >= 300), and disable the Cloudflare
# tile endpoint, or both will be sent tiles.
version: v2
name: worker

build:
  method: docker
  context: .
  dockerfile: ./deploy/tile.Dockerfile

env:
  PORT: "8080"
  # No overall cap on tiles in flight: the service autoscales with load instead (empty = unset;
  # Porter merges env, so removing the line wouldn't clear it).
  MAX_CONCURRENT_TILES: ""
  # No per-render cap.
  MAX_TILES_PER_RENDER: ""
  # One browser session's tiles in flight (all its renders), round-robin over sessions, so one
  # visitor's renders can't take the whole service.
  MAX_TILES_PER_SESSION: "32"

envGroups:
  - ray-tracer-secrets

services:
  - name: web
    type: web
    run: ray-tile-server
    port: 8080
    # Each pod renders about as many tiles at once as it has cores.
    # A 48-core node: two pods of 22 cores, leaving room for the node's own system pods.
    cpuCores: 22
    ramMegabytes: 8192
    # Scales with load (there is no overall cap on tiles in flight): a pod is added when average
    # CPU use passes 70%, up to 10 pods; at least one stays up.
    autoscaling:
      enabled: true
      minInstances: 1
      maxInstances: 10
      cpuThresholdPercent: 70
    healthCheck:
      enabled: true
      httpPath: /healthz
      timeoutSeconds: 2
      initialDelaySeconds: 2
    ingressAnnotations:
      # A tile may take up to the task's 300 s timeout; ingress-nginx cuts requests at 60 s by default.
      nginx.ingress.kubernetes.io/proxy-read-timeout: "330"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "330"
    terminationGracePeriodSeconds: 330
