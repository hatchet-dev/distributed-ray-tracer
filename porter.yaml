# Porter app "worker": the Rust tile renderer (crates/server: render-tiles, validate-shape).
# Built from deploy/porter.Dockerfile, which also holds the Node app run by porter.app.yaml.
#
# Secrets go in a Porter environment group, created before the first deploy:
#   ray-tracer-secrets: HATCHET_SIGNING_SECRET, HATCHET_CLIENT_TOKEN, OPENAI_API_KEY
# Register https://<domain>/hatchet/healthcheck and /hatchet/trigger with Hatchet as a
# GENERIC_HTTP endpoint (requestTimeoutSeconds >= 300).
# Deployed by .github/workflows/porter-app-6445-worker.yml (porter apply -f porter.yaml).
version: v2
name: worker

build:
  method: docker
  context: .
  dockerfile: ./deploy/porter.Dockerfile

env:
  PORT: "8080"

envGroups:
  - ray-tracer-secrets

services:
  - name: web
    type: web
    run: ray-tile-server
    port: 8080
    # Each pod renders about as many tiles at once as it has cores.
    # A 48-core node: two pods of 22 cores, leaving room for the node's own system pods.
    cpuCores: 22
    ramMegabytes: 32768
    # Scales with load: a pod is added when average
    # CPU use passes 70%, up to 30 pods; at least one stays up.
    autoscaling:
      enabled: true
      minInstances: 1
      maxInstances: 30
      cpuThresholdPercent: 70
    healthCheck:
      enabled: true
      httpPath: /healthz
      timeoutSeconds: 2
      initialDelaySeconds: 2
    ingressAnnotations:
      # A tile may take up to the task's 300 s timeout; ingress-nginx cuts requests at 60 s by default.
      nginx.ingress.kubernetes.io/proxy-read-timeout: "330"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "330"
    terminationGracePeriodSeconds: 330
