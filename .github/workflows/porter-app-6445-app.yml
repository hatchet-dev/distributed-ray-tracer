"on":
    push:
        branches:
            - main
name: Deploy to app
jobs:
    porter-deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: Set Github tag
              id: vars
              run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
            - name: Setup porter
              uses: porter-dev/setup-porter@v0.2.0
            - name: Deploy stack
              timeout-minutes: 30
              run: porter apply -f porter.app.yaml
              env:
                PORTER_APP_NAME: app
                PORTER_CLUSTER: "6445"
                PORTER_DEPLOYMENT_TARGET_ID: 3b67053c-2bcb-45d1-a0bd-e1ecc4bdc1c3
                PORTER_HOST: https://dashboard.porter.run
                PORTER_PROJECT: "18772"
                PORTER_TAG: ${{ steps.vars.outputs.sha_short }}
                PORTER_TOKEN: ${{ secrets.PORTER_APP_18772_28957 }}
