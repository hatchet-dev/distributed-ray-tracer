# The whole app as one Worker: the page (static assets), the render API, and the orchestration
# workflows (describe-and-render, render-scene) as a Hatchet serverless endpoint under /hatchet.
name = "serverless-ray-tracer-site"
main = "src/cloudflare.ts"
compatibility_date = "2026-11-01"
# nodejs_compat exposes secrets on process.env, where src/env.ts reads them.
# enable_request_signal aborts request.signal when the browser disconnects.
compatibility_flags = ["nodejs_compat", "enable_request_signal"]
# The Hatchet Cloudflare account, which owns hatchet.run.
account_id = "ce58899025952c372a8f39f38b781fdf"
# Cloudflare creates the DNS record and certificate for a custom domain on deploy.
routes = [{ pattern = "ray.hatchet.run", custom_domain = true }]

[assets]
directory = "public"

# The page's preview module (crates/preview, wasm) is built into public/preview/.
[build]
command = "../scripts/build-preview.sh"
watch_dir = "../crates"

# Tiles are spread over a few render tasks (RENDER_TASKS, default 44: about the tile
# server's cores), so tile size (TILE_MAX_SIZE, default 16) no longer sets how many tasks
# Hatchet hands out; smaller tiles balance the tasks better.

[limits]
# Fan-out mostly waits on children (no CPU), but leave headroom for large renders.
cpu_ms = 300000

# Secrets (`wrangler secret put`; `.dev.vars` under `wrangler dev`):
#   HATCHET_CLIENT_TOKEN    tenant API token: starting, cancelling and reading runs and streams
#   HATCHET_SIGNING_SECRET  >= 32 chars, also given to Hatchet when registering the endpoint
#   OPENAI_API_KEY          shape-script generation

# Abuse guards for POST /api/render (src/guard.ts), per client IP. Every render counts against
# RENDER_LIMITER; chat turns (which also call the model) count against CHAT_LIMITER too. A period
# is 10 or 60 seconds; namespace_id is any number unique to this account.
[[ratelimits]]
name = "RENDER_LIMITER"
namespace_id = "1001"
simple = { limit = 8, period = 60 }

[[ratelimits]]
name = "CHAT_LIMITER"
namespace_id = "1002"
simple = { limit = 4, period = 60 }

# Cloudflare Turnstile on renders: the widget's site key (public) here, and its secret key as the
# TURNSTILE_SECRET_KEY secret. Without the secret, renders aren't checked.
[vars]
TURNSTILE_SITE_KEY = ""
